<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bri Blair</title>
<meta name="description" content="Bri Blair: apps and projects.">
<style>
  :root{--bg:#f6f4ef;--ink:#1d1d1b;--muted:#6b6a65;--card:#fff;--line:#e4e1d9;--accent:#c8442b}
  @media (prefers-color-scheme:dark){:root{--bg:#151513;--ink:#f1efe9;--muted:#9c9a93;--card:#1f1f1c;--line:#2e2d29;--accent:#e2664c}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
  main{width:100%;max-width:720px;padding:72px 24px}
  h1{font-size:44px;line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
  .lead{color:var(--muted);margin:0 0 48px;font-size:18px}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
  .grid{display:grid;gap:12px}
  a.card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
  a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .title{font-weight:600;font-size:17px}
  .sub{color:var(--muted);font-size:14px}
  .tag{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .arrow{color:var(--accent);font-size:20px;flex:none}
  footer{margin-top:64px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Bri Blair</h1>
  <p class="lead">Apps and projects.</p>

  <h2>Apps</h2>
  <div class="grid">
    <!-- To add an app, copy one <a class="card"> block below. -->
    <a class="card" href="https://dashboard.briblair.com">
      <div>
        <div class="title">Lead Dashboard</div>
        <div class="sub">dashboard.briblair.com</div>
      </div>
      <span class="tag">🔒 Login required</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </div>

  <footer>© 2026 Bri Blair</footer>
</main>
</body>
</html>
